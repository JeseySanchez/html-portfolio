<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="icon" href="kiko/assets/kiko-192.png">
  <style>
    :root { --bg: #fff8f3; --ink: #2d2a32; --muted: #7b7480; --card: #fff; --line: #f0e4dc; --green: #3f9a46; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1b20; --ink: #f5eff2; --muted: #a9a1ad; --card: #2a272e; --line: #3a363f; --green: #5bbb62; } }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    a.card { display: flex; align-items: center; gap: 16px; padding: 18px; border: 2px solid var(--line); border-radius: 20px; background: var(--card); color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--green); }
    a.card img { width: 72px; height: auto; }
    a.card b { font-size: 1.3rem; color: var(--green); }
    a.card p { margin: 4px 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Projects</h1>
    <a class="card" href="kiko/">
      <img src="kiko/assets/kiko-192.png" alt="Kiko the bunny">
      <div><b>Kiko</b><p>Learn a language one task at a time, using methods backed by learning science.</p></div>
    </a>
  </main>
</body>
</html>
