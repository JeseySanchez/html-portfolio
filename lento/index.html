<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lento Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn Spanish and French through comprehensible input: graded stories with pictures, audio and tap-to-gloss words.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
/* Layout: a slim sticky bar over one calm column; the library is a shelf per level, the reader a single 42rem reading column. */
:root {
  --bg: #EDF2F0; --surface: #F9FBFA; --sunk: #E1E9E6; --ink: #13302E; --muted: #55706B; --line: #CCDAD5;
  --accent: #1D6B65; --accent-ink: #FFFFFF; --accent-soft: #D3E6E2;
  --mark: #D39A12; --mark-bg: #F8DB86; --mark-fg: #3A2A00;
  --good: #2A774A; --bad: #AE3F2A;
  --f-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1615; --surface: #13201E; --sunk: #0A1211; --ink: #E0EAE7; --muted: #8DA39E; --line: #233431;
    --accent: #5BC0B5; --accent-ink: #052320; --accent-soft: #173B37;
    --mark: #E8B53E; --mark-bg: #5A4513; --mark-fg: #FCE8B2;
    --good: #5DC48B; --bad: #EE8B74; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1615; --surface: #13201E; --sunk: #0A1211; --ink: #E0EAE7; --muted: #8DA39E; --line: #233431;
  --accent: #5BC0B5; --accent-ink: #052320; --accent-soft: #173B37;
  --mark: #E8B53E; --mark-bg: #5A4513; --mark-fg: #FCE8B2;
  --good: #5DC48B; --bad: #EE8B74; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }

.wrap { max-width: 68rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-weight: 800; font-size: 1.45rem; letter-spacing: -0.03em; text-decoration: none; display: flex; align-items: baseline; gap: 2px; }
.brand i { font-style: normal; color: var(--mark); }
.nav { display: flex; gap: 4px; margin-right: auto; }
.nav a { text-decoration: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

main { padding-block: 28px 120px; }
.eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn.danger { color: var(--bad); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }

/* library */
.intro { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px 48px; align-items: end; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.intro h1 { font-size: clamp(2.2rem, 5.5vw, 3.9rem); font-weight: 800; letter-spacing: -0.035em; margin-block: 10px 14px; }
.intro h1 span { background: linear-gradient(transparent 58%, var(--mark-bg) 58% 92%, transparent 92%); padding-inline: 2px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 38rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stats div { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stats span { font-size: .8rem; color: var(--muted); }

.upnext { margin-top: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px 24px; align-items: center; padding: 20px 24px; border-radius: var(--r); background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.upnext .eyebrow { color: inherit; opacity: .8; }
.upnext h2 { font-size: 1.6rem; font-weight: 800; margin-block: 4px; font-family: var(--f-read); font-weight: 500; letter-spacing: -0.01em; }
.upnext p { opacity: .9; max-width: 44rem; }
.upnext .cover { font-size: 2.6rem; width: 4.5rem; height: 4.5rem; display: grid; place-items: center; border-radius: 14px; background: rgb(255 255 255 / .14); }
.upnext .go { font-weight: 700; white-space: nowrap; }

.shelf { margin-top: 44px; }
.shelf-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 16px; }
.shelf-head h2 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
.cefr { font-size: .8rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; }
.shelf-head p { color: var(--muted); flex-basis: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.card .cover { font-size: 1.9rem; line-height: 1; }
.card h3 { font-family: var(--f-read); font-weight: 500; font-size: 1.25rem; letter-spacing: -0.01em; }
.card .en { color: var(--muted); font-size: .9rem; }
.card .meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: auto; }
.meter { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; width: var(--v); background: var(--accent); border-radius: 99px; }
.badge { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.b-zone { background: var(--mark-bg); color: var(--mark-fg); }
.b-start { background: var(--accent-soft); color: var(--ink); }
.b-done { background: none; color: var(--good); border: 1px solid currentColor; }

.method { margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 24px; padding-top: 24px; border-top: 1px solid var(--line); }
.method h3 { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
.method p { color: var(--muted); font-size: .92rem; }

/* reader */
.reader { max-width: 42rem; margin: 0 auto; }
.back { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .9rem; }
.back:hover { color: var(--ink); }
.r-head { margin-block: 18px 18px; }
.r-head h1 { font-family: var(--f-read); font-weight: 500; font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -0.02em; margin-block: 8px 4px; }
.r-head .sub { color: var(--muted); font-style: italic; font-family: var(--f-read); }
.cov-line { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cov-line .meter { flex: 1; max-width: 12rem; margin: 0; }

.controls { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; margin-inline: -12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-radius: var(--r); border: 1px solid var(--line); }
.controls select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 10px; font-weight: 600; font-size: .85rem; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.toggle input { accent-color: var(--accent); margin: 0; }
.timer { margin-left: auto; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.timer b { color: var(--ink); }
.voice-note { font-size: .82rem; color: var(--bad); margin-top: 8px; }

.sents { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-direction: column; }
.sent { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 14px 12px; margin-inline: -12px; border-radius: var(--r); transition: background .2s; }
.has-pics .sent { grid-template-columns: 3.6rem minmax(0, 1fr); }
.sent.speaking { background: var(--accent-soft); }
.pic { width: 3.6rem; height: 3.6rem; display: grid; place-items: center; font-size: 2rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.tl { font-family: var(--f-read); font-size: 1.32rem; line-height: 1.65; transition: filter .25s; }
.en-tr { margin-top: 6px; color: var(--muted); font-size: .95rem; border-left: 2px solid var(--line); padding-left: 10px; }
.s-actions { display: flex; gap: 6px; margin-top: 6px; opacity: .55; transition: opacity .15s; }
.sent:hover .s-actions, .sent:focus-within .s-actions, .sent.speaking .s-actions { opacity: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 700; letter-spacing: .04em; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--accent); }
.icon-btn svg { width: 10px; height: 10px; fill: currentColor; }

.w { cursor: pointer; border-radius: 4px; padding: 0 1px; margin: 0 -1px; transition: background .15s; }
.w:hover { background: var(--accent-soft); }
.marks .w.s-new { text-decoration: underline dotted var(--mark); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.marks .w.s-learn { background: var(--mark-bg); color: var(--mark-fg); }
.w.active { outline: 2px solid var(--accent); }
.hide-text .sent:not(.revealed) .tl { filter: blur(7px); cursor: pointer; user-select: none; }
.hide-text .sent:not(.revealed) .tl .w { pointer-events: none; }

.panel { margin-top: 36px; padding: 22px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.panel h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.015em; margin-bottom: 4px; }
.panel > p { color: var(--muted); }
.q { margin-top: 20px; }
.q-text { font-family: var(--f-read); font-size: 1.12rem; margin-bottom: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--bg); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-family: var(--f-read); font-size: 1rem; text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); color: var(--good); font-weight: 500; }
.opt.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.q-fb { font-size: .85rem; margin-top: 6px; min-height: 1.3em; }
.q-fb.ok { color: var(--good); } .q-fb.no { color: var(--bad); }
.chk { display: flex; gap: 10px; align-items: flex-start; margin-block: 14px 18px; cursor: pointer; }
.chk input { margin-top: 4px; accent-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.done-sum { font-size: 1.05rem; margin-block: 8px 18px; }
.done-sum b { font-variant-numeric: tabular-nums; }

/* word sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 30rem; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px rgb(0 0 0 / .22); padding: 16px 18px; animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(14px); opacity: .4; } }
.sh-top { display: flex; align-items: center; gap: 10px; }
.sh-word { font-family: var(--f-read); font-size: 1.6rem; font-weight: 500; margin-right: auto; overflow-wrap: anywhere; }
.sh-gloss { margin-block: 4px 14px; font-size: 1.02rem; }
.sh-gloss.none { color: var(--muted); font-style: italic; }
.x { border: 0; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.sheet .seg { width: 100%; }
.sheet .seg button { flex: 1; }

/* progress */
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; }
.p-head h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; }
.big { font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 800; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: .4em; color: var(--muted); letter-spacing: -0.01em; font-weight: 600; }
.split { color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; margin-top: 28px; align-items: start; }
.card-p { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.card-p h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
.card-p .hint { color: var(--muted); font-size: .88rem; }
.chart { width: 100%; height: auto; display: block; margin-top: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-ui); }
.chart text.today { fill: var(--ink); font-weight: 700; }
.chart .r { fill: var(--accent); } .chart .o { fill: var(--mark); }
.legend { display: flex; gap: 16px; font-size: .82rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.ladder { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; }
.ladder li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--muted); }
.ladder li:first-child { border-top: 0; }
.ladder .h { font-weight: 800; font-variant-numeric: tabular-nums; }
.ladder b { display: block; color: inherit; font-weight: 700; }
.ladder .reached { color: var(--ink); }
.ladder .reached .h { color: var(--accent); }
.ladder .current { background: var(--accent-soft); border-radius: 10px; padding-inline: 10px; margin-inline: -10px; border-top-color: transparent; }
.ladder .current + li { border-top-color: transparent; }
.ladder .nextm .meter { max-width: 14rem; }
.ladder small { display: block; font-size: .8rem; margin-top: 4px; font-variant-numeric: tabular-nums; }

form.log { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
form.log label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; font-weight: 600; color: var(--muted); }
form.log input, form.log select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; font-weight: 500; color: var(--ink); }
form.log .btn { grid-column: 1 / -1; justify-content: center; }
.recent { list-style: none; padding: 0; margin: 14px 0 0; font-size: .88rem; }
.recent li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.recent li span:first-child { flex: 1; min-width: 0; }
.linkish { border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: .8rem; padding: 0; }

.vocab-counts { display: flex; gap: 24px; margin-top: 10px; }
.vocab-counts b { font-size: 1.8rem; font-weight: 800; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.vocab-counts span { font-size: .8rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--mark-bg); color: var(--mark-fg); border-radius: 8px; padding: 4px 10px; cursor: pointer; text-align: left; }
.chip span { font-family: var(--f-read); font-weight: 500; }
.chip small { opacity: .75; margin-left: 4px; }
.chip:hover { border-color: var(--mark); }
.empty { color: var(--muted); font-size: .9rem; margin-top: 12px; }
.confirm { margin-top: 12px; padding: 12px; border: 1px solid var(--bad); border-radius: 10px; }
.confirm p { margin-bottom: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .9rem; box-shadow: 0 8px 24px rgb(0 0 0 / .25); max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .intro, .grid2, .p-head { grid-template-columns: minmax(0, 1fr); }
  .upnext { grid-template-columns: auto minmax(0, 1fr); }
  .upnext .go { grid-column: 1 / -1; }
  .tl { font-size: 1.2rem; }
  .bar { position: static; }
  .controls { top: env(safe-area-inset-top, 0px); }
}
@media (max-width: 460px) {
  form.log { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  form.log label:last-of-type { grid-column: 1 / -1; }
  .has-pics .sent { grid-template-columns: 2.8rem minmax(0, 1fr); gap: 10px; }
  .pic { width: 2.8rem; height: 2.8rem; font-size: 1.5rem; border-radius: 10px; }
  .stats b { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#library" aria-label="Lento home">lento<i>.</i></a>
    <nav class="nav" aria-label="Main">
      <a href="#library" data-nav="library">Stories</a>
      <a href="#progress" data-nav="progress">Progress</a>
    </nav>
    <div class="seg" role="group" aria-label="Language" id="langs"></div>
  </div>
</header>
<main class="wrap" id="app"></main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-label="Word details">
    <div class="sh-top">
      <span class="sh-word" id="sh-word"></span>
      <button class="icon-btn" id="sh-say" type="button"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z"/></svg>Hear it</button>
      <button class="x" id="sh-close" type="button" aria-label="Close">×</button>
    </div>
    <p class="sh-gloss" id="sh-gloss"></p>
    <div class="seg" role="group" aria-label="How well do you know this word?" id="sh-states">
      <button type="button" data-s="0">New</button>
      <button type="button" data-s="1">Learning</button>
      <button type="button" data-s="2">Known</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// DATA START

/* ---------- state ---------- */
const KEY = 'lento:v1';
function defaults() {
  return { v: 1, lang: 'es', words: { es: {}, fr: {} }, log: { es: {}, fr: {} }, done: {}, outside: [], prefs: { rate: 0.85, marks: true, hide: false } };
}
function load() {
  const d = defaults();
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && o.v === 1) {
      return { ...d, ...o, words: { ...d.words, ...o.words }, log: { ...d.log, ...o.log }, prefs: { ...d.prefs, ...o.prefs } };
    }
  } catch (e) {}
  return d;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
if (!LANGS[S.lang]) S.lang = 'es';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const z2 = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
function fmtDur(sec) {
  const m = Math.floor(sec / 60), h = Math.floor(m / 60);
  return h ? `${h}h ${z2(m % 60)}m` : `${m}m`;
}
const fmtClock = sec => `${Math.floor(sec / 60)}:${z2(sec % 60)}`;

const TOK = /\p{L}+['’](?=\p{L})|\p{L}+(?:-\p{L}+)*/gu;
const keyOf = t => t.toLowerCase().replace(/’/g, "'");
const NAMESET = Object.fromEntries(Object.entries(NAMES).map(([l, a]) => [l, new Set(a)]));
const isName = (lang, k) => NAMESET[lang].has(k);
const tokenKeys = text => Array.from(text.matchAll(TOK), m => keyOf(m[0]));
function wstate(lang, k) { return isName(lang, k) ? 2 : (S.words[lang][k] || 0); }
function wclass(lang, k) { return isName(lang, k) ? 's-name' : ['s-new', 's-learn', 's-known'][wstate(lang, k)]; }
function wrapWords(text, lang) {
  let out = '', last = 0;
  for (const m of text.matchAll(TOK)) {
    const k = keyOf(m[0]);
    out += esc(text.slice(last, m.index)) + `<span class="w ${wclass(lang, k)}" data-k="${esc(k)}" tabindex="0" role="button">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function storyKeys(st) { return st._k || (st._k = st.sentences.flatMap(s => tokenKeys(s[0]))); }
function coverage(st) {
  const ks = storyKeys(st);
  let sum = 0;
  for (const k of ks) { const s = wstate(st.lang, k); sum += s === 2 ? 1 : s === 1 ? 0.5 : 0; }
  return ks.length ? sum / ks.length : 0;
}
const pct = x => Math.round(x * 100);
const readMinutes = st => Math.max(1, Math.round(storyKeys(st).length / LEVELS[st.level].wpm));
function badge(st) {
  if (S.done[st.id]) return ['done', 'Finished'];
  const c = coverage(st);
  if (c >= 0.98) return ['easy', 'Easy read'];
  if (c >= 0.85) return ['zone', 'In your zone'];
  if (st.level === 0) return ['start', 'Start here'];
  return ['stretch', 'Stretch'];
}
function nextUp(lang) {
  const list = STORIES.filter(s => s.lang === lang && !S.done[s.id]);
  if (!list.length) return null;
  const zone = list.filter(s => { const c = coverage(s); return c >= 0.85 && c < 0.98; }).sort((a, b) => a.level - b.level);
  return zone[0] || list.sort((a, b) => a.level - b.level)[0];
}
function totals(lang) {
  let r = 0, o = 0;
  for (const e of Object.values(S.log[lang] || {})) { r += e.r || 0; o += e.o || 0; }
  return { r, o, t: r + o };
}
function streak(lang) {
  const L = S.log[lang] || {}, d = new Date();
  const has = x => { const e = L[dayKey(x)]; return e && (e.r || 0) + (e.o || 0) >= 60; };
  if (!has(d)) d.setDate(d.getDate() - 1);
  let n = 0;
  while (has(d)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function countWords(lang, state) { return Object.values(S.words[lang]).filter(v => v === state).length; }
function logEntry(lang, day) { const L = S.log[lang] || (S.log[lang] = {}); return L[day] || (L[day] = { r: 0, o: 0 }); }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- speech ---------- */
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voices = [];
function loadVoices() { try { voices = synth ? synth.getVoices() : []; } catch (e) { voices = []; } }
if (synth) { loadVoices(); synth.addEventListener?.('voiceschanged', () => { loadVoices(); if (cur) updateVoiceNote(); }); }
function voiceFor(lang) {
  const t = LANGS[lang].tts.toLowerCase();
  const norm = v => v.lang.replace('_', '-').toLowerCase();
  return voices.find(v => norm(v) === t) || voices.find(v => norm(v).startsWith(lang)) || null;
}
function say(text, lang, onend) {
  if (!synth) { onend && onend(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANGS[lang].tts; u.rate = S.prefs.rate;
  const v = voiceFor(lang); if (v) u.voice = v;
  u.onend = u.onerror = () => onend && onend();
  synth.speak(u);
}
let playTok = 0, playing = false;
function stopAudio() {
  playTok++; playing = false;
  if (synth) synth.cancel();
  document.querySelectorAll('.sent.speaking').forEach(e => e.classList.remove('speaking'));
  const b = $('#play-all'); if (b) b.innerHTML = playIcon + 'Listen';
}
function playFrom(i, single) {
  if (!cur) return;
  stopAudio();
  const tok = playTok, st = cur.story;
  playing = true;
  const b = $('#play-all'); if (b && !single) b.innerHTML = pauseIcon + 'Pause';
  const step = j => {
    if (tok !== playTok) return;
    document.querySelectorAll('.sent.speaking').forEach(e => e.classList.remove('speaking'));
    if (j >= st.sentences.length || (single && j > i)) { stopAudio(); return; }
    const li = document.querySelector(`.sent[data-i="${j}"]`);
    if (li) { li.classList.add('speaking'); if (!single) li.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
    say(st.sentences[j][0], st.lang, () => { if (tok === playTok) setTimeout(() => step(j + 1), 450); });
  };

}
const playIcon = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0h3v10H1zM6 0h3v10H6z"/></svg>';

/* ---------- input timer ---------- */
let cur = null; // { story, pending, total, answers }
let lastAct = Date.now();
['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
function commit() {
  if (!cur || !cur.pending) return;
  logEntry(cur.story.lang, dayKey()).r += cur.pending;
  cur.pending = 0; save();
}
setInterval(() => {
  if (!cur || cur.finished || document.visibilityState !== 'visible') return;
  if (Date.now() - lastAct > 90000 && !playing) return; // idle for 90s: stop counting
  cur.pending++; cur.total++;
  if (cur.pending >= 15) commit();
  const t = $('#timer b'); if (t) t.textContent = fmtClock(cur.total);
}, 1000);
addEventListener('pagehide', commit);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') commit(); });

    <div><h3>Stay in your zone</h3><p>Pick stories where you know 85–98% of the words. Below that, meaning collapses. Above it, there is little left to acquire.</p></div>

  const c = pct(coverage(st));

      <h1 lang="${st.lang}">${esc(st.title)}</h1>
      <p class="sub">${esc(st.en)}</p>
      <div class="cov-line"><div class="meter" style="--v:${c}%" id="cov-meter"><i></i></div><span id="cov-text">You know about ${c}% of these words</span></div>
    </header>
    <div class="controls" role="toolbar" aria-label="Reading controls">
      <button class="btn primary small" id="play-all" type="button">${playIcon}Listen</button>
      <select id="rate" aria-label="Speech speed">
        ${[[0.6, 'Very slow'], [0.75, 'Slow'], [0.85, 'Relaxed'], [1, 'Natural']].map(([v, n]) => `<option value="${v}" ${S.prefs.rate == v ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      <label class="toggle"><input type="checkbox" id="hide" ${S.prefs.hide ? 'checked' : ''}> Hide text</label>
      <label class="toggle"><input type="checkbox" id="marks" ${S.prefs.marks ? 'checked' : ''}> Mark new words</label>
      <span class="timer" id="timer">Input <b>0:00</b></span>
    </div>
    <p class="voice-note" id="voice-note" hidden></p>
    <ol class="sents">`;
  st.sentences.forEach(([tl, en, pic], i) => {
    h += `<li class="sent" data-i="${i}">
      ${pics ? `<div class="pic" aria-hidden="true">${pic || ''}</div>` : ''}
      <div>
        <p class="tl" lang="${st.lang}">${wrapWords(tl, st.lang)}</p>
        <p class="en-tr" hidden>${esc(en)}</p>
        <div class="s-actions">
          <button class="icon-btn" type="button" data-say="${i}" aria-label="Play sentence ${i + 1}">${playIcon}Play</button>
          <button class="icon-btn" type="button" data-tr="${i}" aria-expanded="false">EN</button>
        </div>
      </div></li>`;
  });
  h += `</ol>
    <section class="panel" aria-labelledby="chk-h">
      <h2 id="chk-h">Check your understanding</h2>
      <p>Answer in your head first, then pick. These questions only check whether the story came through.</p>
      ${st.questions.map(([q, opts], qi) => `<div class="q" data-q="${qi}">
        <p class="q-text" lang="${st.lang}">${wrapWords(q, st.lang)}</p>
        <div class="opts">${opts.map((o, oi) => `<button type="button" class="opt" lang="${st.lang}" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join('')}</div>
        <p class="q-fb" aria-live="polite"></p></div>`).join('')}
    </section>
    <section class="panel" id="finish-box">${finishForm(st)}</section>
  </article>`;
  app.innerHTML = h;
  scrollTo(0, 0);
  updateVoiceNote();
}
function finishForm(st) {
  const n = newWordsLeft(st);
  return `<h2>Finished the story?</h2>
    <p>Finishing logs your input time and updates your vocabulary.</p>
    ${n ? `<label class="chk"><input type="checkbox" id="mark-rest" checked><span>Mark the <b id="left-n">${n}</b> word${n === 1 ? '' : 's'} I never tapped as known</span></label>` : '<p style="margin-block:14px 18px">Every word in this story is already marked.</p>'}
    <button class="btn primary" type="button" id="finish">Finish story</button>`;
}
function updateVoiceNote() {
  const n = $('#voice-note'); if (!n || !cur) return;
  const L = LANGS[cur.story.lang];
  if (!synth) { n.hidden = false; n.textContent = 'This browser has no text-to-speech, so audio is unavailable. Reading still counts as input.'; }
  else if (voices.length && !voiceFor(cur.story.lang)) { n.hidden = false; n.textContent = `No ${L.name} voice is installed on this device, so playback may use a default voice. Add a ${L.name} voice in your system’s speech settings for the best audio.`; }
  else n.hidden = true;
}
function refreshReaderStats() {
  if (!cur) return;
  const c = pct(coverage(cur.story));
  const m = $('#cov-meter'); if (m) m.style.setProperty('--v', c + '%');
  const t = $('#cov-text'); if (t) t.textContent = `You know about ${c}% of these words`;
  const ln = $('#left-n'); if (ln) ln.textContent = newWordsLeft(cur.story);
}
function finishStory() {
  const st = cur.story;
  commit();
  let moved = 0;
  const mark = $('#mark-rest');
  if (mark && mark.checked) {
    for (const k of new Set(storyKeys(st))) {
      if (!isName(st.lang, k) && wstate(st.lang, k) === 0) { S.words[st.lang][k] = 2; moved++; }
    }
  }
  const qs = st.questions.length, right = Object.values(cur.answers).filter(Boolean).length;
  S.done[st.id] = { at: dayKey(), score: `${right}/${qs}` };
  cur.finished = true;
  save();
  document.querySelectorAll('#reader .w').forEach(el => { el.className = 'w ' + wclass(st.lang, el.dataset.k); });
  refreshReaderStats();
  const nu = nextUp(st.lang), t = totals(st.lang);
  $('#finish-box').innerHTML = `<h2>Story finished</h2>
    <p class="done-sum">You spent <b>${fmtClock(cur.total)}</b> with this story${moved ? ` and moved <b>${moved}</b> words to Known` : ''}. Your ${LANGS[st.lang].name} total is now <b>${fmtDur(t.t)}</b>.</p>
    <div class="row">${nu ? `<a class="btn primary" href="#read-${nu.id}">Next: <span lang="${nu.lang}">${esc(nu.title)}</span> →</a>` : ''}<a class="btn" href="#library">All stories</a><a class="btn" href="#progress">See progress</a></div>`;
  toast('Story finished and input logged');
}

/* ---------- word sheet ---------- */
let sheetWord = null;
function openSheet(el) {
  const lang = cur ? cur.story.lang : S.lang, k = el.dataset.k;
  document.querySelectorAll('.w.active').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  if (!isName(lang, k) && wstate(lang, k) === 0) setWord(lang, k, 1); // looking a word up means you are learning it
  sheetWord = { lang, k, text: el.textContent };
  $('#sh-word').textContent = el.textContent;
  $('#sh-word').lang = lang;
  const g = DICT[lang][k];
  const gl = $('#sh-gloss');
  gl.textContent = g || 'No dictionary entry yet. Tap EN under the sentence to see its translation.';
  gl.classList.toggle('none', !g);
  syncSheetStates();
  $('#sheet').hidden = false;
}
function syncSheetStates() {
  if (!sheetWord) return;
  const s = wstate(sheetWord.lang, sheetWord.k), name = isName(sheetWord.lang, sheetWord.k);
  document.querySelectorAll('#sh-states button').forEach(b => { b.setAttribute('aria-pressed', String(+b.dataset.s === s)); b.disabled = name; });
}
function closeSheet() {
  $('#sheet').hidden = true; sheetWord = null;
  document.querySelectorAll('.w.active').forEach(e => e.classList.remove('active'));
}
function setWord(lang, k, s) {
  if (s === 0) delete S.words[lang][k]; else S.words[lang][k] = s;
  save();
  const cls = wclass(lang, k);
  document.querySelectorAll(`.w[data-k="${CSS.escape(k)}"]`).forEach(el => { el.classList.remove('s-new', 's-learn', 's-known'); el.classList.add(cls); });
  refreshReaderStats();
}

/* ---------- progress ---------- */
function niceMax(v) { for (const n of [10, 15, 20, 30, 45, 60, 90, 120, 180, 240, 360, 480, 720]) if (v <= n) return n; return Math.ceil(v / 60) * 60; }
function chartSVG(lang) {
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const e = (S.log[lang] || {})[dayKey(d)] || { r: 0, o: 0 }; days.push({ d, r: (e.r || 0) / 60, o: (e.o || 0) / 60 }); }
  const max = niceMax(Math.max(...days.map(x => x.r + x.o)));
  const W = 560, H = 190, l = 40, r = 8, top = 10, bot = 26, ch = H - top - bot, cw = (W - l - r) / 14, bw = cw * 0.58;
  const y = v => top + ch - (v / max) * ch;
  const lab = v => v >= 60 && v % 60 === 0 ? `${v / 60}h` : `${v}m`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes of input per day over the last 14 days">`;
  for (const v of [0, max / 2, max]) s += `<line class="grid" x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end">${lab(v)}</text>`;
  days.forEach((x, i) => {
    const cx = l + cw * i + cw / 2, x0 = cx - bw / 2;
    if (x.r > 0) s += `<rect class="r" x="${x0}" y="${y(x.r)}" width="${bw}" height="${y(0) - y(x.r)}" rx="2"><title>${Math.round(x.r)} min reading</title></rect>`;
    if (x.o > 0) s += `<rect class="o" x="${x0}" y="${y(x.r + x.o)}" width="${bw}" height="${y(x.r) - y(x.r + x.o)}" rx="2"><title>${Math.round(x.o)} min outside</title></rect>`;
    const today = i === 13;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="${today ? 'today' : ''}">${today ? 'Today' : x.d.toLocaleDateString('en', { weekday: 'narrow' })}</text>`;
  });
  return s + '</svg>';
}
function renderProgress() {
  setNav('progress');
  const lang = S.lang, L = LANGS[lang], t = totals(lang), hrs = t.t / 3600, sk = streak(lang);
  let reachedIdx = 0;
  MILESTONES.forEach(([m], i) => { if (hrs >= m) reachedIdx = i; });
  const ladder = MILESTONES.map(([m, name, desc], i) => {
    const reached = i <= reachedIdx, current = i === reachedIdx, next = i === reachedIdx + 1;
    let extra = '';
    if (next) {
      const prev = MILESTONES[reachedIdx][0], p = Math.min(100, ((hrs - prev) / (m - prev)) * 100);
      extra = `<div class="meter" style="--v:${p.toFixed(1)}%"><i></i></div><small>${(m - hrs).toFixed(1)} hours to go</small>`;
    }
    return `<li class="${reached ? 'reached' : ''} ${current ? 'current' : ''} ${next ? 'nextm' : ''}"><span class="h">${m}h</span><div><b>${name}</b>${desc}${extra}</div></li>`;
  }).join('');
  const learning = Object.entries(S.words[lang]).filter(([, v]) => v === 1).map(([k]) => k);
  const recent = S.outside.filter(o => o.lang === lang).slice(-5).reverse();
  app.innerHTML = `<section class="p-head">
      <div><p class="eyebrow">${L.name} · your input</p><h1>Hours you understood</h1></div>
    </section>
    <div class="grid2">
      <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
        <div class="card-p">
          <p class="big">${Math.floor(hrs)}<small>h</small> ${z2(Math.floor((t.t / 60) % 60))}<small>m</small></p>
          <p class="split">${fmtDur(t.r)} reading here · ${fmtDur(t.o)} outside · ${sk ? `${sk}-day streak` : 'No streak yet'}</p>
          ${chartSVG(lang)}
          <div class="legend"><span><i style="background:var(--accent)"></i>Reading in Lento</span><span><i style="background:var(--mark)"></i>Outside input</span></div>
          ${t.t === 0 ? `<p class="empty">Nothing logged yet. Open a story and the timer starts on its own.</p>` : ''}
        </div>
        <div class="card-p">
          <h2>Log outside input</h2>
          <p class="hint">Podcasts, shows and conversations count when you understood most of them.</p>
          <form class="log" id="o-form">
            <label for="o-min">Minutes<input id="o-min" type="number" min="1" max="600" value="20" required></label>
            <label for="o-kind">Kind<select id="o-kind">${OUTSIDE_KINDS.map(k => `<option>${k}</option>`).join('')}</select></label>
            <label for="o-date">Day<input id="o-date" type="date" value="${dayKey()}" max="${dayKey()}" required></label>
            <button class="btn primary" type="submit">Add to log</button>
          </form>
          ${recent.length ? `<ul class="recent">${recent.map(o => `<li><span>${esc(o.kind)}</span><span>${o.mins} min · ${new Date(o.date + 'T12:00').toLocaleDateString('en', { month: 'short', day: 'numeric' })}</span><button class="linkish" type="button" data-rm="${o.id}">Remove</button></li>`).join('')}</ul>` : ''}
        </div>
        <div class="card-p">
          <h2>Vocabulary</h2>
          <p class="hint">Words you tap become “learning”. Unknown words left in a finished story can move to “known”.</p>
          <div class="vocab-counts"><div><b>${countWords(lang, 2)}</b><span>known</span></div><div><b>${learning.length}</b><span>learning</span></div></div>
          ${learning.length ? `<div class="chips">${learning.slice(0, 80).map(k => `<button class="chip" type="button" data-know="${esc(k)}" title="Mark as known"><span lang="${lang}">${esc(k)}</span><small>${esc((DICT[lang][k] || '').split(/[,·;(]/)[0].trim())}</small></button>`).join('')}</div><p class="empty">Tap a word once it feels familiar to mark it known.</p>` : `<p class="empty">No learning words yet. Tap any word while reading to look it up.</p>`}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
        <div class="card-p">
          <h2>Roadmap</h2>
          <p class="hint">A rough guide drawn from learners who acquire languages mostly through input. Your pace will vary.</p>
          <ol class="ladder">${ladder}</ol>
        </div>
        <div class="card-p">
          <h2>Start over</h2>
          <p class="hint">Clears ${L.name} words, input log and finished stories on this device.</p>
          <div style="margin-top:12px"><button class="btn danger small" type="button" id="reset">Reset ${L.name} progress</button></div>
          <div class="confirm" id="reset-confirm" hidden><p>Reset all ${L.name} progress? This can’t be undone.</p><div class="row"><button class="btn danger small" type="button" id="reset-yes">Reset</button><button class="btn small" type="button" id="reset-no">Cancel</button></div></div>
        </div>
      </div>
    </div>`;
}

/* ---------- routing ---------- */
function leaveReader() { stopAudio(); commit(); closeSheet(); cur = null; }
function route() {
  leaveReader();
  const h = location.hash.slice(1);
  if (h.startsWith('read-')) {
    const st = STORIES.find(s => s.id === h.slice(5));
    if (st) return renderReader(st);
  }
  if (h === 'progress') return renderProgress();
  renderLibrary();
}
addEventListener('hashchange', route);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const lb = t.closest('[data-lang]');
  if (lb) {
    S.lang = lb.dataset.lang; save(); renderLangs();
    if (location.hash.startsWith('#read-')) location.hash = '#library'; else route();
    return;
  }
  const w = t.closest('.w');
  if (w) { openSheet(w); return; }
  const tl = t.closest('.hide-text .sent:not(.revealed) .tl');
  if (tl) { tl.closest('.sent').classList.add('revealed'); return; }
  if (t.closest('#play-all')) { playing ? stopAudio() : playFrom(0); return; }
  const sy = t.closest('[data-say]');
  if (sy) { playFrom(+sy.dataset.say, true); return; }
  const tr = t.closest('[data-tr]');
  if (tr) {
    const p = tr.closest('.sent').querySelector('.en-tr');
    p.hidden = !p.hidden; tr.setAttribute('aria-expanded', String(!p.hidden));
    return;
  }
  const op = t.closest('.opt');
  if (op && cur && !op.disabled) {
    const qi = +op.dataset.q, oi = +op.dataset.o, q = cur.story.questions[qi], ok = oi === q[2];
    cur.answers[qi] = ok;
    const box = op.closest('.q');
    box.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i === q[2]) b.classList.add('right'); });
    if (!ok) op.classList.add('wrong');
    const fb = box.querySelector('.q-fb');
    fb.className = 'q-fb ' + (ok ? 'ok' : 'no');
    fb.textContent = ok ? 'Right.' : `Not quite. The answer is “${q[1][q[2]]}”.`;
    return;
  }
  if (t.closest('#finish')) { finishStory(); return; }
  const st = t.closest('#sh-states button');
  if (st && sheetWord) { setWord(sheetWord.lang, sheetWord.k, +st.dataset.s); syncSheetStates(); return; }
  if (t.closest('#sh-say') && sheetWord) { stopAudio(); say(sheetWord.text, sheetWord.lang); return; }
  if (t.closest('#sh-close')) { closeSheet(); return; }
  const kn = t.closest('[data-know]');
  if (kn) { S.words[S.lang][kn.dataset.know] = 2; save(); toast(`“${kn.dataset.know}” marked as known`); renderProgress(); return; }
  const rm = t.closest('[data-rm]');
  if (rm) {
    const i = S.outside.findIndex(o => String(o.id) === rm.dataset.rm);
    if (i > -1) { const o = S.outside[i]; const e2 = logEntry(o.lang, o.date); e2.o = Math.max(0, (e2.o || 0) - o.mins * 60); S.outside.splice(i, 1); save(); toast('Entry removed'); renderProgress(); }
    return;
  }
  if (t.closest('#reset')) { $('#reset-confirm').hidden = false; return; }
  if (t.closest('#reset-no')) { $('#reset-confirm').hidden = true; return; }
  if (t.closest('#reset-yes')) {
    const lang = S.lang;
    S.words[lang] = {}; S.log[lang] = {}; S.outside = S.outside.filter(o => o.lang !== lang);
    for (const s of STORIES) if (s.lang === lang) delete S.done[s.id];
    save(); toast(`${LANGS[lang].name} progress reset`); renderProgress(); return;
  }
  if (!t.closest('#sheet')) closeSheet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('w')) { e.preventDefault(); openSheet(e.target); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rate') { S.prefs.rate = +t.value; save(); if (playing) stopAudio(); }
  if (t.id === 'hide') { S.prefs.hide = t.checked; save(); $('#reader').classList.toggle('hide-text', t.checked); if (!t.checked) document.querySelectorAll('.sent.revealed').forEach(s => s.classList.remove('revealed')); }
  if (t.id === 'marks') { S.prefs.marks = t.checked; save(); $('#reader').classList.toggle('marks', t.checked); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'o-form') return;
  e.preventDefault();
  const mins = Math.round(+$('#o-min').value), kind = $('#o-kind').value, date = $('#o-date').value || dayKey();
  if (!(mins > 0)) return;
  logEntry(S.lang, date).o += mins * 60;
  S.outside.push({ id: Date.now(), lang: S.lang, date, mins, kind });
  save(); toast(`Added ${mins} min of ${kind.toLowerCase()}`); renderProgress();
});

renderLangs();
route();
</script>
</body>
</html>
